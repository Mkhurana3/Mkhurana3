name: Update stats

on:
  schedule:
    - cron: "37 0 * * *"   # daily, 06:07 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stats.svg
        run: python3 stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --cached --quiet || (git commit -m "Update stats" && git push)
